# Fixed project name so the CLI and Unraid's Compose Manager manage the same stack
# (otherwise the CLI would name it after the folder).
name: navi

services:
  navi:
    # Built and published by .github/workflows/docker-publish.yml on every push to main.
    image: ghcr.io/hyrumrichardson/navi-discord-bot:latest
    container_name: navi
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      # Watchtower pulls new :latest images and restarts Navi with them.
      com.centurylinklabs.watchtower.enable: "true"

  postgres:
    image: postgres:16-alpine
    container_name: navi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      # Keep Watchtower away from the database: update it by hand when you choose to.
      com.centurylinklabs.watchtower.enable: "false"
